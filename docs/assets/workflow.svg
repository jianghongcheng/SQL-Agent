<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1100" viewBox="0 0 1620 1100" role="img" aria-labelledby="title desc">
<title id="title">SQL-Agent system architecture</title><desc id="desc">A left-to-right LangGraph SQL agent with durable requests, schema grounding, planning, policy-gated execution, bounded recovery, advisory verification, human review, approved writes, and isolated BIRD evaluation.</desc>
<defs><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#718096"/></marker><style>
text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:34px;font-weight:720;fill:#172033}.subtitle{font-size:15px;fill:#64748B}.lane-title{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#64748B}.node{filter:url(#shadow)}.step{font-size:12px;font-weight:700;fill:white}.node-title{font-size:16px;font-weight:700;fill:#172033}.node-copy{font-size:12.5px;fill:#536176}.branch-title{font-size:14px;font-weight:700;fill:#273449}.branch-copy{font-size:12px;fill:#64748B}.edge{fill:none;stroke:#718096;stroke-width:1.7;marker-end:url(#arrow)}.note{font-size:12px;fill:#64748B}
</style></defs><rect width="1620" height="1100" fill="#FFF"/>
<text x="55" y="54" class="title">SQL-Agent</text><text x="55" y="82" class="subtitle">Grounded planning, controlled execution, bounded recovery, and reproducible evaluation</text>
<rect x="35" y="125" width="1550" height="360" rx="18" fill="#FCFDFF" stroke="#DCE6F5"/><text x="55" y="157" class="lane-title">ONLINE READ WORKFLOW</text>
<rect x="35" y="525" width="1550" height="195" rx="18" fill="#FEFCFF" stroke="#E7DDF4"/><text x="55" y="557" class="lane-title">HUMAN-APPROVED MUTATION WORKFLOW</text>
<rect x="35" y="780" width="1550" height="275" rx="18" fill="#FBFEFC" stroke="#D5EBDD"/><text x="55" y="812" class="lane-title">OFFLINE BIRD MINI-DEV EVALUATION</text>
<g class="node"><rect x="55" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="77" cy="213" r="12" fill="#2457A7"/><text x="77" y="217" text-anchor="middle" class="step">1</text><text x="98" y="219" class="node-title">Request</text><text x="73" y="249" class="node-copy">Browser · API · MCP</text><text x="73" y="268" class="node-copy">durable job + worker</text></g><g class="node"><rect x="275" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="297" cy="213" r="12" fill="#2457A7"/><text x="297" y="217" text-anchor="middle" class="step">2</text><text x="318" y="219" class="node-title">Ground</text><text x="293" y="249" class="node-copy">Allowlisted schema</text><text x="293" y="268" class="node-copy">optional scoped RAG</text></g><g class="node"><rect x="495" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="517" cy="213" r="12" fill="#2457A7"/><text x="517" y="217" text-anchor="middle" class="step">3</text><text x="538" y="219" class="node-title">Plan</text><text x="513" y="249" class="node-copy">SQL · clarify · stop</text><text x="513" y="268" class="node-copy">structured decision</text></g><g class="node"><rect x="715" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="737" cy="213" r="12" fill="#2457A7"/><text x="737" y="217" text-anchor="middle" class="step">4</text><text x="758" y="219" class="node-title">Authorize</text><text x="733" y="249" class="node-copy">Database + table scope</text><text x="733" y="268" class="node-copy">read-only SQL + limits</text></g><g class="node"><rect x="935" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="957" cy="213" r="12" fill="#2457A7"/><text x="957" y="217" text-anchor="middle" class="step">5</text><text x="978" y="219" class="node-title">Execute</text><text x="953" y="249" class="node-copy">Bounded DB call</text><text x="953" y="268" class="node-copy">timeout + row limits</text></g><g class="node"><rect x="1155" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="1177" cy="213" r="12" fill="#2457A7"/><text x="1177" y="217" text-anchor="middle" class="step">6</text><text x="1198" y="219" class="node-title">Verify</text><text x="1173" y="249" class="node-copy">Independent SQL</text><text x="1173" y="268" class="node-copy">result agreement signal</text></g><g class="node"><rect x="1375" y="190" width="190" height="106" rx="12" fill="#F7FAFF" stroke="#B9D0F5"/><circle cx="1397" cy="213" r="12" fill="#2457A7"/><text x="1397" y="217" text-anchor="middle" class="step">7</text><text x="1418" y="219" class="node-title">Review</text><text x="1393" y="249" class="node-copy">SQL · result · trace</text><text x="1393" y="268" class="node-copy">accept or reject</text></g><polyline points="245,243 275,243" class="edge"/><polyline points="465,243 495,243" class="edge"/><polyline points="685,243 715,243" class="edge"/><polyline points="905,243 935,243" class="edge"/><polyline points="1125,243 1155,243" class="edge"/><polyline points="1345,243 1375,243" class="edge"/><g><rect x="495" y="350" width="190" height="76" rx="10" fill="#FFFBF2" stroke="#F0CD82"/><rect x="495" y="350" width="4" height="76" rx="2" fill="#A95D08"/><text x="512" y="377" class="branch-title">Clarification</text><text x="512" y="399" class="branch-copy">checkpoint · answer · resume</text></g><g><rect x="935" y="350" width="190" height="76" rx="10" fill="#FFFBF2" stroke="#F0CD82"/><rect x="935" y="350" width="4" height="76" rx="2" fill="#A95D08"/><text x="952" y="377" class="branch-title">Execution repair</text><text x="952" y="399" class="branch-copy">eligible errors · bounded retries</text></g><g><rect x="1155" y="350" width="190" height="76" rx="10" fill="#FFFBF2" stroke="#F0CD82"/><rect x="1155" y="350" width="4" height="76" rx="2" fill="#A95D08"/><text x="1172" y="377" class="branch-title">Semantic repair</text><text x="1172" y="399" class="branch-copy">optional · verifier-guided retry</text></g><polyline points="590,296 590,350" class="edge" stroke-dasharray="6 6"/><polyline points="1030,296 1030,350" class="edge" stroke-dasharray="6 6"/><polyline points="1250,296 1250,350" class="edge" stroke-dasharray="6 6"/><polyline points="935,388 850,388 850,316 590,316 590,296" class="edge" stroke-dasharray="6 6"/><polyline points="1345,388 1355,388 1355,316 1470,316 1470,296" class="edge" stroke-dasharray="6 6"/><g><rect x="295" y="590" width="220" height="82" rx="10" fill="#FBF8FF" stroke="#D8C5F2"/><rect x="295" y="590" width="4" height="82" rx="2" fill="#7041A6"/><text x="312" y="617" class="branch-title">Mutation request</text><text x="312" y="639" class="branch-copy">separate from read execution</text></g><g><rect x="625" y="590" width="220" height="82" rx="10" fill="#FBF8FF" stroke="#D8C5F2"/><rect x="625" y="590" width="4" height="82" rx="2" fill="#7041A6"/><text x="642" y="617" class="branch-title">Impact preview</text><text x="642" y="639" class="branch-copy">show operation and affected scope</text></g><g><rect x="955" y="590" width="220" height="82" rx="10" fill="#FBF8FF" stroke="#D8C5F2"/><rect x="955" y="590" width="4" height="82" rx="2" fill="#7041A6"/><text x="972" y="617" class="branch-title">Explicit approval</text><text x="972" y="639" class="branch-copy">decision bound to the request</text></g><g><rect x="1285" y="590" width="220" height="82" rx="10" fill="#FBF8FF" stroke="#D8C5F2"/><rect x="1285" y="590" width="4" height="82" rx="2" fill="#7041A6"/><text x="1302" y="617" class="branch-title">Transactional write</text><text x="1302" y="639" class="branch-copy">idempotency · receipt · rollback</text></g><polyline points="515,631 625,631" class="edge"/><polyline points="845,631 955,631" class="edge"/><polyline points="1175,631 1285,631" class="edge"/><g><rect x="75" y="850" width="230" height="82" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="75" y="850" width="4" height="82" rx="2" fill="#217A4B"/><text x="92" y="877" class="branch-title">Official Mini-Dev</text><text x="92" y="899" class="branch-copy">500 questions · evidence · schema</text></g><g><rect x="375" y="850" width="230" height="82" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="375" y="850" width="4" height="82" rx="2" fill="#217A4B"/><text x="392" y="877" class="branch-title">Agent inference</text><text x="392" y="899" class="branch-copy">same guarded read workflow</text></g><g><rect x="675" y="850" width="230" height="82" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="675" y="850" width="4" height="82" rx="2" fill="#217A4B"/><text x="692" y="877" class="branch-title">Candidate execution</text><text x="692" y="899" class="branch-copy">generated SQL result</text></g><g><rect x="975" y="850" width="230" height="82" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="975" y="850" width="4" height="82" rx="2" fill="#217A4B"/><text x="992" y="877" class="branch-title">Execution scorer</text><text x="992" y="899" class="branch-copy">candidate result vs gold result</text></g><g><rect x="1275" y="850" width="230" height="82" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="1275" y="850" width="4" height="82" rx="2" fill="#217A4B"/><text x="1292" y="877" class="branch-title">Evidence</text><text x="1292" y="899" class="branch-copy">accuracy · cost · p95 · pairs</text></g><polyline points="305,891 375,891" class="edge"/><polyline points="605,891 675,891" class="edge"/><polyline points="905,891 975,891" class="edge"/><polyline points="1205,891 1275,891" class="edge"/><g><rect x="760" y="965" width="230" height="72" rx="10" fill="#F5FBF8" stroke="#A9D8BF"/><rect x="760" y="965" width="4" height="72" rx="2" fill="#217A4B"/><text x="777" y="992" class="branch-title">Isolated gold SQL</text><text x="777" y="1014" class="branch-copy">available only after inference</text></g><polyline points="875,965 875,947 1090,947 1090,932" class="edge" stroke-dasharray="6 6"/><text x="55" y="1078" class="note">Dashed lines show interrupts or bounded retry paths. Verifier agreement is evidence, not a correctness guarantee.</text></svg>