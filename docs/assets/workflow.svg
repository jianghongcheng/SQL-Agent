<svg xmlns="http://www.w3.org/2000/svg" width="960" height="870" viewBox="0 0 960 870" role="img" aria-labelledby="title desc">
<title id="title">contractsql workflow</title><desc id="desc">Agent execution paths with explicit repair, stop, and review decisions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#20364b} .label{font-weight:700;font-size:17px} .edge{fill:none;stroke:#52677c;stroke-width:2;marker-end:url(#arrow)} .node{fill:#f0f5fa;stroke:#9aafc3;stroke-width:1.5} .keep{fill:#eaf7f0;stroke:#70ad8e} .repair{fill:#fff5e5;stroke:#c9a45f} .stop{fill:#fcefed;stroke:#c89991}</style>
<rect width="960" height="870" rx="12" fill="#fff"/>
<path class="edge" d="M480 96V126"/>
<path class="edge" d="M480 202V232"/>
<path class="edge" d="M480 308V338"/>
<path class="edge" d="M480 414V446"/>
<path class="edge" d="M405 480H170V540"/>
<path class="edge" d="M480 514V540"/>
<path class="edge" d="M555 480H790V540"/>
<path class="edge" d="M40 584H18V270H300"/>
<path class="edge" d="M480 637V685H660"/>
<path class="edge" d="M790 637V685H660"/>
<g><rect class="node" x="300" y="20" width="360" height="76" rx="10"/><text x="480" y="47" text-anchor="middle" class="label">Question + registered task</text><text x="480" y="71" text-anchor="middle">Authorize request and persist job</text></g>
<g><rect class="node" x="300" y="126" width="360" height="76" rx="10"/><text x="480" y="153" text-anchor="middle" class="label">Durable worker</text><text x="480" y="177" text-anchor="middle">Claim job, renew lease, collect schema</text></g>
<g><rect class="node" x="300" y="232" width="360" height="76" rx="10"/><text x="480" y="259" text-anchor="middle" class="label">Local LLM</text><text x="480" y="283" text-anchor="middle">Propose one SQL query</text></g>
<g><rect class="node" x="300" y="338" width="360" height="76" rx="10"/><text x="480" y="365" text-anchor="middle" class="label">Read-only execution</text><text x="480" y="389" text-anchor="middle">Check query limits and result format</text></g>
<polygon points="480,446 555,480 480,514 405,480" fill="#eaf0fb" stroke="#9aafc3" stroke-width="1.5"/><text x="480" y="486" text-anchor="middle" class="label">Route</text>
<g><rect class="node repair" x="40" y="540" width="260" height="97" rx="10"/><text x="170" y="567" text-anchor="middle" class="label">REPAIR</text><text x="170" y="591" text-anchor="middle">Repairable error; budget left</text><text x="170" y="612" text-anchor="middle">Add SQL and error feedback</text></g>
<g><rect class="node keep" x="350" y="540" width="260" height="97" rx="10"/><text x="480" y="567" text-anchor="middle" class="label">KEEP CANDIDATE</text><text x="480" y="591" text-anchor="middle">Runtime checks passed</text><text x="480" y="612" text-anchor="middle">Save result and execution record</text></g>

<g><rect class="node stop" x="660" y="540" width="260" height="97" rx="10"/><text x="790" y="567" text-anchor="middle" class="label">STOP</text><text x="790" y="591" text-anchor="middle">Denied or budget exhausted</text><text x="790" y="612" text-anchor="middle">Retain failure evidence</text></g>
<g><rect class="node" x="500" y="722" width="320" height="76" rx="10"/><text x="660" y="749" text-anchor="middle" class="label">Human review</text><text x="660" y="773" text-anchor="middle">Inspect candidate or stopped task</text></g>
<path class="edge" d="M660 685V722"/>
<text x="480" y="840" text-anchor="middle">All SQL attempts within one job share a read snapshot.</text>
</svg>
