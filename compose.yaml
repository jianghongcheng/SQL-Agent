services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radmeasure
      POSTGRES_USER: radmeasure
      POSTGRES_PASSWORD: ${RADMEASURE_DB_PASSWORD:-local-demo-password}
    volumes:
      - sql-jobs:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radmeasure -d radmeasure"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      RADMEASURE_DATABASE_URL: postgresql://radmeasure:${RADMEASURE_DB_PASSWORD:-local-demo-password}@postgres:5432/radmeasure
      RADMEASURE_API_KEYS: '${RADMEASURE_API_KEYS:-{"viewer-local":{"name":"viewer","role":"viewer"},"operator-local":{"name":"operator","role":"operator"},"admin-local":{"name":"admin","role":"admin"}}}'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["radmeasure-worker", "--poll-seconds", "0.25"]
    environment:
      RADMEASURE_DATABASE_URL: postgresql://radmeasure:${RADMEASURE_DB_PASSWORD:-local-demo-password}@postgres:5432/radmeasure
      RADMEASURE_PLANNER_BASE_URL: ${RADMEASURE_PLANNER_BASE_URL:-}
      RADMEASURE_PLANNER_MODEL: ${RADMEASURE_PLANNER_MODEL:-}
      RADMEASURE_PLANNER_PROVIDER: ${RADMEASURE_PLANNER_PROVIDER:-ollama}
      RADMEASURE_PLANNER_API_KEY: ${RADMEASURE_PLANNER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  sql-jobs:
