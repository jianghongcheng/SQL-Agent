[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractsql"
version = "0.5.0"
description = "Contract-driven SQL Data Agent with bounded repair and auditable execution"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=16,<24"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]
prod = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1"]
harbor = ["harbor>=0.22,<1"]

[project.scripts]
contractsql = "geomed_copilot.cli:main"
contractsql-mcp = "geomed_copilot.mcp_server:main"
contractsql-worker = "geomed_copilot.worker:main"
radmeasure = "geomed_copilot.cli:main"
radmeasure-mcp = "geomed_copilot.mcp_server:main"
radmeasure-worker = "geomed_copilot.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
