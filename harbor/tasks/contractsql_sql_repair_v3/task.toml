schema_version = "1.4"
artifacts = ["/app/submission.json"]

[task]
name = "contractsql/sql-repair-v3"
version = "3.0.0"
description = "Confirmatory policy-gated SQL repair over 108 held-out cases and six schemas."
authors = [{ name = "Hongcheng Jiang", email = "hongcheng.jiang@outlook.com" }]
keywords = ["agent-evaluation", "sql-repair", "policy", "verifier", "safety"]

[metadata]
category = "agent-reliability"
difficulty = "medium"
tags = ["contractsql", "sql", "confirmatory", "separate-verifier"]

[agent]
timeout_sec = 300.0
network_mode = "no-network"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024

[verifier.environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
